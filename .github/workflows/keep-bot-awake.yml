# NOT the keep-alive anymore: GitHub's scheduler throttles frequent cron
# workflows, and measurements showed this */5 job actually fired only every
# 4-8 hours (39 runs in 9 days), which made the bot answer students that late.
# Real wake-ups come from an external uptime pinger hitting /health every few
# minutes. This workflow stays as a WATCHDOG: it fails loudly if the backend
# stops answering, and its push trigger gives a free wake right after a deploy.
name: Backend watchdog

on:
  schedule:
    # Sparse on purpose - frequent schedules get throttled AND teach GitHub to
    # deprioritize this repo's schedules after any cancelled run.
    - cron: "*/30 * * * *"
  # Manual trigger for testing, plus a wake-up right after every deploy.
  workflow_dispatch:
  push:
    branches: [main]

# The job makes one outbound request; it needs no repo permissions.
permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          url="${{ vars.BACKEND_URL }}"
          if [ -z "$url" ]; then
            echo "::error::Repository variable BACKEND_URL is not set (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          # A cold instance takes up to ~60s to answer, so retry instead of
          # reporting a false failure. -m 25 per attempt, 3 attempts.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 25 -w "%{http_code}" "$url/health" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Backend did not answer $url/health with 200"
          exit 1
        shell: bash
