# Render blueprint — deploy the bot/webhook server.
# Mini App domain (Vercel) must be registered with the bot via
# BotFather -> /newapp or "Set Menu Button URL".
services:
  - type: web
    name: english-exercises-bot
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_TEACHER_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: qwen/qwen3.8-27b
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_APP_URL
        sync: false
      # Short link from BotFather /newapp (optional) -> shareable t.me links.
      - key: TME_APP_URL
        sync: false
